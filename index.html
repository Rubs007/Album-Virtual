<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#080808">
    <meta name="description"
          content="Reproductor premium de álbum">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <title>Álbum Player</title>
</head>

<body>

<div class="background"></div>

<main class="player">

    <!-- HEADER -->

    <header class="topbar">

        <div class="logo">
            ALBUM
        </div>

        <div class="status">
            <span class="status-dot"></span>
            <span id="connectionStatus">ONLINE</span>
        </div>

        <button id="installButton" class="install hidden">
            INSTALAR
        </button>

    </header>


    <!-- ALBUM -->

    <section class="album">

        <div class="cover-container">

            <div class="cover-glow"></div>

            <img
                id="cover"
                class="cover"
                src="portada.jpg"
                alt="Portada del álbum"
            >

        </div>


        <div class="album-info">

            <span class="album-type">
                ÁLBUM
            </span>

            <h1 id="albumTitle">
                Mi Álbum
            </h1>

            <p id="artist">
                Mi Artista
            </p>

            <span id="albumYear" class="year">
                2026
            </span>

        </div>

    </section>


    <!-- NOW PLAYING -->

    <section class="now-playing">

        <div class="track-info">

            <span id="trackNumber">
                01
            </span>

            <div>

                <h2 id="trackTitle">
                    Canción 1
                </h2>

                <p id="trackArtist">
                    Mi Artista
                </p>

            </div>

        </div>


        <!-- PROGRESS -->

        <div class="timeline">

            <span id="currentTime">
                0:00
            </span>

            <input
                id="progress"
                type="range"
                min="0"
                max="100"
                value="0"
            >

            <span id="duration">
                0:00
            </span>

        </div>


        <!-- CONTROLS -->

        <div class="controls">

            <button id="shuffle"
                    class="control secondary"
                    title="Aleatorio">

                ⤨

            </button>


            <button id="previous"
                    class="control"
                    title="Anterior">

                ⏮

            </button>


            <button id="play"
                    class="play-button"
                    title="Reproducir">

                ▶

            </button>


            <button id="next"
                    class="control"
                    title="Siguiente">

                ⏭

            </button>


            <button id="repeat"
                    class="control secondary"
                    title="Repetir">

                ↻

            </button>

        </div>


        <!-- VOLUME -->

        <div class="volume">

            <span>🔊</span>

            <input
                id="volume"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.85"
            >

        </div>

    </section>


    <!-- TRACKLIST -->

    <section class="tracklist">

        <div class="tracklist-header">

            <span>
                PISTAS
            </span>

            <span id="trackCount">
                5 canciones
            </span>

        </div>

        <div id="playlist"></div>

    </section>

</main>


<audio
    id="audio"
    preload="metadata">
</audio>


<script src="app.js"></script>

</body>
</html>
